<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Manoel Pedra</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./shared.js"></script>
</head>
<body class="bg-zinc-50 min-h-screen">
<header class="bg-white border-b p-4 flex justify-between">
  <b>Admin - Supabase ON</b>
  <a href="./index.html" class="text-xs underline">Voltar site</a>
</header>
<main class="max-w-[700px] mx-auto p-4">
  <div class="bg-white border rounded-xl p-5">
    <h3 class="font-bold">Gerar Codigo</h3>
    <input id="empresa" placeholder="Empresa opcional" class="mt-3 w-full h-10 border rounded-xl px-3">
    <button onclick="gerar()" class="mt-3 h-10 px-5 bg-[#ffbf00] rounded-xl font-bold">Gerar MP-XXXX</button>
    <div id="gerado" class="mt-4 hidden bg-zinc-900 text-white p-4 rounded-xl">
      <div class="text-xs text-zinc-400">Codigo gerado</div>
      <div id="codigo-gerado" class="font-mono text-2xl font-bold"></div>
    </div>
  </div>
  <div class="bg-white border rounded-xl p-5 mt-4">
    <h3 class="font-bold">Codigos (<span id="qtd-cod">0</span>) - Supabase</h3>
    <div id="lista-cod" class="mt-3 space-y-2 text-xs font-mono"></div>
  </div>
  <div class="bg-white border rounded-xl p-5 mt-4">
    <h3 class="font-bold">Fichas (<span id="qtd-ficha">0</span>) - Supabase</h3>
    <div id="lista-ficha" class="mt-3 space-y-2 text-xs"></div>
  </div>
</main>
<script>
function gerar(){
  const emp = document.getElementById("empresa").value.trim();
  const codigo = gerarCodigo();
  Store.setCodigos([{codigo, empresa:emp||"SEM EMPRESA", data:new Date().toISOString(), status:"disponivel"}, ...Store.getCodigos()]);
  document.getElementById("codigo-gerado").textContent = codigo;
  document.getElementById("gerado").classList.remove("hidden");
  document.getElementById("empresa").value="";
  render();
}
function render(){
  const codigos = Store.getCodigos();
  document.getElementById("qtd-cod").textContent = codigos.length;
  document.getElementById("lista-cod").innerHTML = codigos.map(c=>`<div class="flex justify-between border-b py-1"><span>${c.codigo} - ${c.empresa||""} - ${c.status}</span><button onclick="delCod('${c.codigo}')" class="text-red-600">x</button></div>`).join("") || "Nenhum - sincronizando Supabase...";
  const fichas = Store.getFichas();
  document.getElementById("qtd-ficha").textContent = fichas.length;
  document.getElementById("lista-ficha").innerHTML = fichas.map(f=>`<div class="border-b py-1"><b>${f.protocolo}</b> - ${f.razao} - ${f.cnpj}</div>`).join("") || "Nenhuma";
}
function delCod(c){ if(confirm("Excluir "+c+"?")){ Store.deleteCodigo(c); render(); } }
setTimeout(()=>{ Store.syncFromSupabase().then(()=>render()); }, 800);
render();
window.addEventListener("mp_sync", render);
</script>
</body>
</html>
