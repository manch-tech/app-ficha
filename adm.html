<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Manoel Pedra - Ficha - Painel Administrativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { margin:0; font-family:'Inter',ui-sans-serif,system-ui,sans-serif; background:#f9fafb; color:#1f2937; }
  .mono { font-family:'JetBrains Mono',monospace; }
  .btn-primary { background:#ffbf00; color:#000; font-family:'Montserrat',sans-serif; font-weight:700; }
  .btn-primary:hover { filter:brightness(0.95); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./shared.js"></script>
<script type="text/babel" data-presets="react">

function TelaLogin({ onEntrar }) {
  const [senha, setSenha] = React.useState("");
  function tentar() {
    if (senha === Store.getSenha()) onEntrar();
    else alert("Senha incorreta");
  }
  return (
    <div className="mx-auto max-w-[400px]">
      <div className="rounded-[20px] bg-white border border-zinc-200 shadow-sm p-6 sm:p-8">
        <div className="flex items-center gap-3 mb-6">
          <div className="h-10 w-10 rounded-xl bg-zinc-900 text-white flex items-center justify-center">
            <Icon path={ICONS.key} className="h-5 w-5" />
          </div>
          <div>
            <div className="font-bold">Acesso Administrativo</div>
            <div className="text-[11px] text-zinc-500">Manoel Pedra — Painel • Supabase ON</div>
          </div>
        </div>
        <label className="text-[11px] font-semibold uppercase tracking-widest text-zinc-500">Senha</label>
        <input type="password" value={senha} onChange={(e) => setSenha(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && tentar()}
          className="mt-1.5 w-full h-[44px] rounded-xl border border-zinc-200 px-4 text-[14px] outline-none focus:border-zinc-900"
          placeholder="Digite a senha" />
        <button onClick={tentar} className="mt-4 w-full h-[44px] rounded-xl bg-zinc-900 text-white font-semibold text-[14px] hover:bg-black">
          Entrar no painel
        </button>
        <a href="./index.html" className="mt-3 w-full h-[40px] rounded-xl border border-zinc-200 text-[13px] font-medium flex items-center justify-center no-underline text-zinc-900">
          Voltar para o site do cliente
        </a>
      </div>
    </div>
  );
}

function AbaGerar() {
  const [empresa, setEmpresa] = React.useState("");
  const [gerado, setGerado] = React.useState("");

  function gerar() {
    const codigo = gerarCodigo();
    const codigos = Store.getCodigos();
    Store.setCodigos([{ codigo, empresa: empresa.trim() || undefined, data: new Date().toISOString(), status: "disponivel" }, ...codigos]);
    setGerado(codigo);
    setEmpresa("");
  }

  async function copiar(texto) {
    try { await navigator.clipboard.writeText(texto); } catch {}
  }

  return (
    <div className="max-w-[560px]">
      <h3 className="font-semibold">Gerar novo código de acesso</h3>
      <p className="text-[12px] text-zinc-500 mt-1">Cada código é único e de uso único. Salvo no Supabase.</p>
      <div className="mt-4">
        <label className="text-[11px] font-semibold uppercase tracking-widest text-zinc-500">Empresa (opcional)</label>
        <input value={empresa} onChange={(e) => setEmpresa(e.target.value)} placeholder="Ex: CONSTRUTORA ALFA LTDA"
          className="mt-1.5 w-full h-[42px] rounded-xl border border-zinc-200 px-3.5 text-[14px] outline-none focus:border-zinc-900" />
      </div>
      <button onClick={gerar} className="btn-primary mt-3 h-[42px] px-5 rounded-xl">Gerar MP-XXXX aleatório</button>

      {gerado && (
        <div className="mt-6 rounded-xl bg-zinc-900 text-white p-5">
          <div className="text-[11px] uppercase tracking-widest text-zinc-400">Código gerado</div>
          <div className="mono text-[32px] font-bold tracking-widest mt-1">{gerado}</div>
          <div className="mt-4 flex flex-wrap gap-2">
            <button onClick={() => copiar(gerado)} className="h-9 px-3 rounded-full bg-white text-zinc-900 text-[12px] font-semibold flex items-center gap-1.5">
              <Icon path={ICONS.copy} className="h-3.5 w-3.5" /> Copiar
            </button>
            <button
              onClick={() => window.open(`https://wa.me/?text=${encodeURIComponent(`Olá, seu código para preencher a ficha de qualificação é ${gerado} - Acesse ${FICHA_URL}`)}`, "_blank")}
              className="h-9 px-3 rounded-full bg-[#25D366] text-white text-[12px] font-semibold flex items-center gap-1.5">
              <Icon path={ICONS.message} className="h-3.5 w-3.5" /> Enviar por WhatsApp para cliente
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function AbaLista() {
  const [codigos, setCodigos] = React.useState(Store.getCodigos());
  React.useEffect(()=>{
    function onSync(){ setCodigos(Store.getCodigos()); }
    window.addEventListener("mp_sync", onSync);
    return ()=> window.removeEventListener("mp_sync", onSync);
  },[]);
  function salvar(novos) { setCodigos(novos); Store.setCodigos(novos); }

  return (
    <div>
      <div className="flex items-center justify-between">
        <h3 className="font-semibold">Códigos Gerados ({codigos.length}) - Supabase</h3>
        <button onClick={() => { if (confirm("Excluir todos os códigos?")) salvar([]); }} className="text-[11px] text-red-600 hover:underline">Limpar tudo</button>
      </div>
      <div className="mt-4 overflow-auto rounded-xl border border-zinc-200">
        <table className="w-full text-[12px]">
          <thead className="bg-zinc-50 text-[11px] uppercase tracking-widest text-zinc-500">
            <tr>
              <th className="text-left p-2.5">Código</th><th className="text-left p-2.5">Empresa</th>
              <th className="text-left p-2.5">Data</th><th className="text-left p-2.5">Status</th>
              <th className="text-right p-2.5">Ação</th>
            </tr>
          </thead>
          <tbody>
            {codigos.map((c) => (
              <tr key={c.codigo} className="border-t border-zinc-100">
                <td className="p-2.5 mono font-semibold">{c.codigo}</td>
                <td className="p-2.5">{c.empresa || "-"}</td>
                <td className="p-2.5">{new Date(c.data).toLocaleString("pt-BR")}</td>
                <td className="p-2.5">
                  <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${c.status === "disponivel" ? "bg-emerald-50 text-emerald-700 border border-emerald-200" : "bg-zinc-100 text-zinc-600"}`}>{c.status}</span>
                </td>
                <td className="p-2.5 text-right">
                  <button onClick={() => { const novos = codigos.filter((x) => x.codigo !== c.codigo); setCodigos(novos); Store.setCodigos(novos); }} className="h-7 w-7 inline-flex items-center justify-center rounded-lg hover:bg-zinc-100">
                    <Icon path={ICONS.trash} className="h-4 w-4" />
                  </button>
                </td>
              </tr>
            ))}
            {codigos.length === 0 && <tr><td colSpan={5} className="p-6 text-center text-zinc-400">Nenhum código - gere um ou aguarde sync do Supabase</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function AbaArquivo() {
  const [fichas, setFichas] = React.useState(Store.getFichas());
  const [busca, setBusca] = React.useState("");
  const [selecionada, setSelecionada] = React.useState(null);

  React.useEffect(()=>{
    function onSync(){ setFichas(Store.getFichas()); }
    window.addEventListener("mp_sync", onSync);
    return ()=> window.removeEventListener("mp_sync", onSync);
  },[]);

  function salvar(novas) { setFichas(novas); Store.setFichas(novas); }

  const filtradas = React.useMemo(() => {
    const b = busca.toLowerCase();
    if (!b) return fichas;
    return fichas.filter((f) => f.razao.toLowerCase().includes(b) || f.protocolo.toLowerCase().includes(b) || f.cnpj.includes(b));
  }, [fichas, busca]);

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3">
        <h3 className="font-semibold">Arquivo de Fichas ({fichas.length}) - Supabase</h3>
        <div className="relative">
          <input value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Buscar razão, protocolo, CNPJ"
            className="h-9 pl-8 pr-3 rounded-full border border-zinc-200 text-[12px] w-[220px] outline-none focus:border-zinc-900" />
        </div>
      </div>
      <div className="mt-4 rounded-xl border border-zinc-200 overflow-auto max-h-[500px]">
        <table className="w-full text-[12px]">
          <thead className="sticky top-0 bg-zinc-50 text-[11px] uppercase tracking-widest text-zinc-500">
            <tr><th className="text-left p-2.5">Protocolo</th><th className="text-left p-2.5">Empresa</th><th className="text-left p-2.5">Data</th><th className="text-right p-2.5">Ver</th></tr>
          </thead>
          <tbody>
            {filtradas.map((f) => (
              <tr key={f.protocolo} onClick={() => setSelecionada(f)} className={`border-t border-zinc-100 hover:bg-zinc-50 cursor-pointer ${selecionada?.protocolo === f.protocolo ? "bg-orange-50" : ""}`}>
                <td className="p-2.5 mono text-[11px] font-semibold">{f.protocolo}</td>
                <td className="p-2.5"><div className="font-medium truncate max-w-[180px]">{f.razao}</div><div className="mono text-[10px] text-zinc-500">{f.cnpj}</div></td>
                <td className="p-2.5 text-[11px]">{f.dataHora}</td>
                <td className="p-2.5 text-right">👁️</td>
              </tr>
            ))}
          </tbody>
        </table>
        {filtradas.length === 0 && <div className="p-8 text-center text-[12px] text-zinc-400">Nenhuma ficha - sincronizando do Supabase...</div>}
      </div>
      {selecionada && (
        <div className="mt-4 rounded-xl border border-zinc-200 p-4">
          <div className="mono font-bold">{selecionada.protocolo}</div>
          <div className="mt-2 text-[12px] space-y-1">
            <div><b>Razão:</b> {selecionada.razao}</div>
            <div><b>CNPJ:</b> {selecionada.cnpj}</div>
            <div><b>Resp:</b> {selecionada.responsavel} - {selecionada.whatsapp}</div>
            <div><b>End:</b> {selecionada.endereco}</div>
          </div>
          <button onClick={() => setSelecionada(null)} className="mt-3 text-[11px] underline">Fechar</button>
        </div>
      )}
    </div>
  );
}

function AbaDocumentos() {
  const [docs, setDocsState] = React.useState(Store.getDocs());
  React.useEffect(()=>{
    function onSync(){ setDocsState(Store.getDocs()); }
    window.addEventListener("mp_sync", onSync);
    return ()=> window.removeEventListener("mp_sync", onSync);
  },[]);
  function salvar(novos) { setDocsState(novos); Store.setDocs(novos); }
  return (
    <div>
      <h3 className="font-semibold">Documentos ({docs.length})</h3>
      <div className="mt-4 space-y-2">
        {docs.map(d=> <div key={d.id} className="p-3 border rounded-xl text-[13px] flex justify-between"><span>{d.titulo}</span><a href={d.url} target="_blank" className="text-blue-600">Abrir</a></div>)}
      </div>
    </div>
  );
}

function AbaConfig() {
  const [whatsapp, setWhatsapp] = React.useState(Store.getWhats());
  function salvarWhats() { Store.setWhats(whatsapp); alert("WhatsApp salvo"); }
  return (
    <div className="max-w-[560px]">
      <h3 className="font-semibold">WhatsApp de recebimento</h3>
      <div className="mt-3 flex gap-2">
        <input value={whatsapp} onChange={(e) => setWhatsapp(e.target.value.replace(/\D/g, ""))} className="flex-1 h-[40px] rounded-xl border border-zinc-200 px-3.5 mono text-[13px]" />
        <button onClick={salvarWhats} className="h-[40px] px-4 rounded-xl bg-white border border-zinc-200 text-[13px] font-semibold">Salvar</button>
      </div>
      <div className="mt-6 text-[11px] text-zinc-500">Supabase: {SUPABASE_CONFIG.url} • enabled: {String(SUPABASE_CONFIG.enabled)}</div>
    </div>
  );
}

const ABAS = [
  { chave: "gerar", label: "Gerar Código", icon: ICONS.key, componente: AbaGerar },
  { chave: "lista", label: "Códigos Gerados", icon: "m3 17 2 2 4-4 m3 7 2 2 4-4 M13 6h8 M13 12h8 M13 18h8", componente: AbaLista },
  { chave: "arquivo", label: "Arquivo", icon: "M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8 M10 12h4", componente: AbaArquivo },
  { chave: "docs", label: "Documentos Fases", icon: ICONS.paperclip, componente: AbaDocumentos },
  { chave: "config", label: "Configurações", icon: "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6", componente: AbaConfig },
];

function Painel() {
  const [aba, setAba] = React.useState("gerar");
  const AbaAtual = ABAS.find((a) => a.chave === aba).componente;
  return (
    <div className="mx-auto max-w-[1000px]">
      <h2 className="text-[20px] font-bold mb-5">Painel Administrativo - Supabase ON</h2>
      <div className="flex gap-2 overflow-auto pb-2">
        {ABAS.map((a) => (
          <button key={a.chave} onClick={() => setAba(a.chave)} className={`h-9 px-4 rounded-full border text-[12px] font-semibold ${aba === a.chave ? "bg-zinc-900 text-white" : "bg-white"}`}>{a.label}</button>
        ))}
      </div>
      <div className="mt-4 rounded-[18px] bg-white border p-5"><AbaAtual /></div>
    </div>
  );
}

function App() {
  const [logado, setLogado] = React.useState(false);
  return (
    <div className="min-h-screen">
      <header className="sticky top-0 z-30 bg-white/80 backdrop-blur border-b">
        <div className="mx-auto max-w-[1100px] px-4 h-[58px] flex items-center justify-between">
          <div className="font-extrabold">Manoel Pedra — Admin • Supabase</div>
          {logado && <button onClick={() => setLogado(false)} className="h-8 px-3 rounded-full bg-zinc-900 text-white text-[12px]">Sair</button>}
        </div>
      </header>
      <main className="mx-auto max-w-[1100px] px-4 py-6">{logado ? <Painel /> : <TelaLogin onEntrar={() => setLogado(true)} />}</main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
