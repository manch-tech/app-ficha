<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM - Manoel Pedra</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#111;color:#fff;padding:20px}
.card{background:#222;padding:16px;border-radius:10px;margin:10px 0}
input{padding:10px;border-radius:6px;border:none;margin:4px}
button{padding:10px 14px;border:none;border-radius:6px;background:#ffcc00;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{border:1px solid #333;padding:8px;text-align:left}
</style>
</head>
<body>
<h1>ADM - Manoel Pedra</h1>
<div id="login">
<input id="senha" type="password" placeholder="Senha"><button onclick="logar()">Entrar</button>
<p>Senha padrão: 1020</p>
</div>
<div id="painel" style="display:none">
<h3>Fichas</h3>
<button onclick="carregar()">Recarregar do Supabase</button>
<table><thead><tr><th>Nome</th><th>Whats</th><th>Endereço</th><th>Serviço</th><th>Data</th></tr></thead><tbody id="lista"></tbody></table>
</div>
<script src="./shared.js"></script>
<script>
function logar(){
  if(document.getElementById('senha').value === SENHA_PADRAO){
    document.getElementById('login').style.display='none';
    document.getElementById('painel').style.display='block';
    carregar();
  }else alert('Senha errada');
}
async function carregar(){
  const fichas = await getFichas();
  const tb = document.getElementById('lista');
  tb.innerHTML = fichas.map(f=>`<tr><td>${f.nome||''}</td><td>${f.whatsapp||f.whats||''}</td><td>${f.endereco||''}</td><td>${f.servico||''}</td><td>${(f.created_at||'').slice(0,19)}</td></tr>`).join('');
}
</script>
</body>
</html>
