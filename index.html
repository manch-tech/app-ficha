<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manoel Pedra - Ficha</title>
<link rel="manifest" href="./manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#0f0f0f;color:#fff;margin:0;padding:20px}
.card{background:#1c1c1c;padding:20px;border-radius:12px;max-width:500px;margin:20px auto}
input,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#2a2a2a;color:#fff}
button{background:#ffcc00;color:#000;padding:14px;border:none;border-radius:8px;width:100%;font-weight:bold;cursor:pointer}
a{color:#ffcc00}
</style>
</head>
<body>
<div class="card">
<h2>📋 Ficha - Manoel Pedra</h2>
<p>Preencha para gerar sua ficha</p>
<input id="nome" placeholder="Nome completo">
<input id="whats" placeholder="WhatsApp">
<input id="endereco" placeholder="Endereço da obra">
<textarea id="servico" placeholder="Serviço desejado"></textarea>
<button onclick="enviar()">Gerar Ficha e Enviar no WhatsApp</button>
<p id="status"></p>
</div>
<script src="./shared.js"></script>
<script>
async function enviar(){
  const ficha = {
    nome: document.getElementById('nome').value,
    whatsapp: document.getElementById('whats').value,
    endereco: document.getElementById('endereco').value,
    servico: document.getElementById('servico').value,
  };
  if(!ficha.nome || !ficha.whatsapp){ alert('Preencha nome e whats'); return; }
  document.getElementById('status').innerText = 'Salvando...';
  const salva = await saveFicha(ficha);
  document.getElementById('status').innerText = 'Salvo! ID: ' + salva.id;
  const msg = `Ola, sou ${ficha.nome}, whats ${ficha.whatsapp}, endereco ${ficha.endereco}, servico ${ficha.servico} - Ficha ${salva.id}`;
  window.open(`https://wa.me/${WHATSAPP_PADRAO}?text=${encodeURIComponent(msg)}`, '_blank');
}
</script>
</body>
</html>
