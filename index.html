<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manoel Pedra - Ficha de Qualificacao</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./shared.js"></script>
<style>body{font-family:Inter,system-ui,sans-serif;background:#f9fafb}</style>
</head>
<body class="min-h-screen">
<header class="bg-white border-b p-4 flex justify-between">
  <b>Manoel Pedra - Ficha - Supabase ON</b>
  <a href="./adm.html" class="text-xs underline">Admin</a>
</header>
<main class="max-w-[480px] mx-auto p-4 mt-6">
  <div id="tela-inicio" class="bg-white border rounded-[20px] p-6 shadow">
    <h2 class="font-bold text-lg">Validar Codigo de Acesso</h2>
    <p class="text-xs text-zinc-500 mt-1">Digite o codigo MP-XXXX enviado pelo WhatsApp. Salvo no Supabase.</p>
    <input id="input-codigo" placeholder="MP-XXXX" class="mt-4 w-full h-[44px] border rounded-xl px-4 uppercase">
    <div id="erro-codigo" class="text-xs text-red-600 mt-2 hidden"></div>
    <button onclick="validarCodigo()" class="mt-3 w-full h-[44px] bg-[#ffbf00] rounded-xl font-bold">Validar e Continuar</button>
    <button onclick="gerarDemo()" class="mt-2 w-full h-[36px] border rounded-xl text-xs">Gerar Demo (teste local)</button>
  </div>

  <div id="tela-ficha" class="hidden bg-white border rounded-[20px] p-6 shadow">
    <h2 class="font-bold">Ficha de Qualificacao</h2>
    <div class="mt-4 space-y-3">
      <div><label class="text-[11px] font-bold uppercase">Razao Social</label><input id="razao" class="w-full h-10 border rounded-xl px-3"></div>
      <div><label class="text-[11px] font-bold uppercase">CNPJ</label><input id="cnpj" class="w-full h-10 border rounded-xl px-3" oninput="this.value=formatarCNPJ(this.value)"></div>
      <div><label class="text-[11px] font-bold uppercase">Responsavel</label><input id="responsavel" class="w-full h-10 border rounded-xl px-3"></div>
      <div><label class="text-[11px] font-bold uppercase">WhatsApp</label><input id="whatsapp" class="w-full h-10 border rounded-xl px-3" oninput="this.value=formatarTelefone(this.value)"></div>
      <div><label class="text-[11px] font-bold uppercase">Endereco</label><input id="endereco" class="w-full h-10 border rounded-xl px-3"></div>
      <button onclick="enviarFicha()" class="w-full h-[44px] bg-zinc-900 text-white rounded-xl font-bold mt-2">Enviar Ficha</button>
    </div>
  </div>

  <div id="tela-ok" class="hidden bg-white border rounded-[20px] p-6 shadow text-center">
    <h2 class="font-bold text-lg">Ficha Enviada!</h2>
    <div class="mt-3 text-sm">Protocolo:</div>
    <div id="protocolo-ok" class="font-mono font-bold text-xl mt-1"></div>
    <button onclick="abrirWhats()" class="mt-4 w-full h-[44px] bg-[#25D366] text-white rounded-xl font-bold">Enviar via WhatsApp</button>
    <button onclick="location.reload()" class="mt-2 w-full h-[36px] border rounded-xl text-xs">Voltar ao inicio</button>
  </div>
</main>

<script>
let codigoUsado = "";
let fichaAtual = null;

function validarCodigo(){
  const c = document.getElementById("input-codigo").value.trim().toUpperCase();
  const codigos = Store.getCodigos();
  const enc = codigos.find(x=>x.codigo===c);
  const erro = document.getElementById("erro-codigo");
  if(!enc || enc.status!=="disponivel"){
    erro.textContent = enc?.status==="usado" ? "Codigo ja usado em "+enc.usadoEm : "Codigo invalido. Va em adm.html e gere um.";
    erro.classList.remove("hidden");
    return;
  }
  erro.classList.add("hidden");
  codigoUsado = c;
  document.getElementById("tela-inicio").classList.add("hidden");
  document.getElementById("tela-ficha").classList.remove("hidden");
}

function gerarDemo(){
  const c = gerarCodigo();
  Store.setCodigos([{codigo:c, data:new Date().toISOString(), status:"disponivel", empresa:"DEMO"}, ...Store.getCodigos()]);
  document.getElementById("input-codigo").value = c;
  alert("Demo gerado: "+c+" - clique Validar");
}

function enviarFicha(){
  const razao = document.getElementById("razao").value.trim();
  const cnpj = document.getElementById("cnpj").value.trim();
  const responsavel = document.getElementById("responsavel").value.trim();
  const whatsapp = document.getElementById("whatsapp").value.trim();
  const endereco = document.getElementById("endereco").value.trim();
  if(!razao || !cnpj || !responsavel){ alert("Preencha razao, cnpj e responsavel"); return; }
  if(cnpj.replace(/\D/g,"").length!==14){ alert("CNPJ invalido"); return; }

  const protocolo = gerarProtocolo();
  const ficha = {
    protocolo,
    razao, cnpj, responsavel, whatsapp, endereco,
    codigoUsado,
    dataISO: new Date().toISOString(),
    dataHora: new Date().toLocaleString("pt-BR")
  };
  Store.setFichas([ficha, ...Store.getFichas()]);
  // marca codigo como usado
  const codigos = Store.getCodigos().map(x=> x.codigo===codigoUsado ? {...x, status:"usado", usadoEm:new Date().toISOString()} : x);
  Store.setCodigos(codigos);
  fichaAtual = ficha;
  document.getElementById("tela-ficha").classList.add("hidden");
  document.getElementById("protocolo-ok").textContent = protocolo;
  document.getElementById("tela-ok").classList.remove("hidden");
}

function abrirWhats(){
  const texto = `FICHA QUALIFICACAO - ${fichaAtual.razao} - CNPJ ${fichaAtual.cnpj} - Protocolo ${fichaAtual.protocolo} - Resp ${fichaAtual.responsavel}`;
  const num = Store.getWhats();
  window.open(`https://wa.me/${num}?text=${encodeURIComponent(texto)}`, "_blank");
}

// sync do supabase ao carregar
setTimeout(()=>{ if(Store.syncFromSupabase) Store.syncFromSupabase(); }, 500);
</script>
</body>
</html>
