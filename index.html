<!DOCTYPE html>
<html lang="pt-BR">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manoel Pedra - Ficha</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./shared.js"></script>
</head>
<body class="bg-zinc-50 min-h-screen">
<header class="bg-white border-b p-4 flex justify-between sticky top-0"><b>Manoel Pedra - Ficha ON</b><a href="./adm.html" class="text-xs underline">Admin</a></header>
<main class="max-w-[720px] mx-auto p-4">
<div id="tela-inicio" class="bg-white border rounded-[20px] p-6">
<h2 class="font-bold text-lg">Ficha de Qualificação</h2>
<p class="text-xs text-zinc-500 mt-1">Digite o código MP-XXXX</p>
<input id="codigo" placeholder="MP-XXXX" class="mt-4 w-full h-11 border rounded-xl px-4 uppercase font-mono">
<div id="erro-codigo" class="hidden text-xs text-red-600 bg-red-50 border rounded-xl p-2 mt-2"></div>
<button onclick="validar()" class="mt-3 w-full h-11 bg-[#ffbf00] rounded-xl font-bold">Validar</button>
</div>

<div id="tela-ficha" class="hidden bg-white border rounded-[20px] p-6 mt-4">
<h2 class="font-bold">Preencha os dados</h2>
<input id="razao" placeholder="Razão Social *" class="mt-3 w-full h-10 border rounded-xl px-3">
<input id="cnpj" placeholder="CNPJ *" class="mt-2 w-full h-10 border rounded-xl px-3" oninput="this.value=formatarCNPJ(this.value)">
<input id="responsavel" placeholder="Responsável *" class="mt-2 w-full h-10 border rounded-xl px-3">
<input id="zap" placeholder="WhatsApp *" class="mt-2 w-full h-10 border rounded-xl px-3" oninput="this.value=formatarTelefone(this.value)">
<input id="endereco" placeholder="Endereço da obra *" class="mt-2 w-full h-10 border rounded-xl px-3">
<label class="mt-3 flex gap-2 text-xs"><input type="checkbox" id="decl"> Declaro verdadeiras as informações, sem influência do Grupo GPS, e autorizo verificação LGPD</label>
<div id="erro-ficha" class="hidden text-xs text-red-600 bg-red-50 border rounded-xl p-2 mt-2"></div>
<button onclick="enviar()" class="mt-3 w-full h-11 bg-[#ffbf00] rounded-xl font-bold">Gerar Ficha e Ver Comprovante</button>
</div>

<div id="tela-comp" class="hidden bg-white border rounded-[20px] p-6 mt-4">
<h2 class="font-bold text-lg">✅ Comprovante Gerado - Protocolo <span id="proto" class="font-mono bg-yellow-100 px-2 rounded"></span></h2>
<div id="dados-comp" class="mt-4 text-sm bg-zinc-50 border rounded-xl p-3"></div>
<div class="mt-4 grid grid-cols-2 gap-2">
<button onclick="enviarZap()" class="h-11 bg-[#25D366] text-white rounded-xl font-bold">Enviar WhatsApp</button>
<button onclick="window.print()" class="h-11 bg-zinc-900 text-white rounded-xl font-bold">Imprimir</button>
</div>
<div id="docs-area" class="mt-6 border-t pt-4">
<h3 class="font-bold text-sm">Próximas Fases - Documentos para Imprimir</h3>
<p class="text-xs text-zinc-500 mt-1">Baixe o termo abaixo, preencha, assine e envie via WhatsApp</p>
<div id="lista-docs-real" class="mt-3"></div>
</div>
<button onclick="location.reload()" class="mt-6 text-xs underline">Voltar ao início</button>
</div>
</main>
<script>
let codigoUsado="", fichaAtual=null;
function validar(){
  const c=document.getElementById("codigo").value.trim().toUpperCase();
  const enc=Store.getCodigos().find(x=>x.codigo===c);
  const erro=document.getElementById("erro-codigo");
  if(!enc || enc.status!=="disponivel"){
    erro.textContent="Código inválido ou já usado. Gere um novo na ADM";
    erro.classList.remove("hidden"); return;
  }
  erro.classList.add("hidden");
  codigoUsado=c;
  document.getElementById("tela-inicio").classList.add("hidden");
  document.getElementById("tela-ficha").classList.remove("hidden");
}
function enviar(){
  try{
    const razao=document.getElementById("razao").value.trim();
    const cnpj=document.getElementById("cnpj").value.trim();
    const responsavel=document.getElementById("responsavel").value.trim();
    const zap=document.getElementById("zap").value.trim();
    const endereco=document.getElementById("endereco").value.trim();
    const decl=document.getElementById("decl").checked;
    const erro=document.getElementById("erro-ficha");
    if(!razao||!cnpj||!responsavel||!zap||!endereco){ erro.textContent="Preencha todos obrigatórios *"; erro.classList.remove("hidden"); return; }
    if(!decl){ erro.textContent="Marque o checkbox da declaração"; erro.classList.remove("hidden"); return; }
    erro.classList.add("hidden");
    const protocolo=gerarProtocolo();
    const ficha={protocolo, razao, cnpj, responsavel, whatsapp:zap, endereco, dataISO:new Date().toISOString(), dataHora:new Date().toLocaleString("pt-BR"), codigoUsado};
    Store.setFichas([ficha, ...Store.getFichas()]);
    Store.setCodigos(Store.getCodigos().map(x=>x.codigo===codigoUsado?{...x,status:"usado"}:x));
    fichaAtual=ficha;
    mostrarComprovante(ficha);
  }catch(e){
    alert("Erro ao gerar ficha: "+e.message);
    console.error(e);
  }
}
function mostrarComprovante(ficha){
  document.getElementById("tela-ficha").classList.add("hidden");
  document.getElementById("tela-inicio").classList.add("hidden");
  document.getElementById("proto").textContent=ficha.protocolo;
  document.getElementById("dados-comp").innerHTML=`
    <b>Razão:</b> ${ficha.razao}<br>
    <b>CNPJ:</b> ${ficha.cnpj}<br>
    <b>Responsável:</b> ${ficha.responsavel}<br>
    <b>WhatsApp:</b> ${ficha.whatsapp}<br>
    <b>Endereço:</b> ${ficha.endereco}<br>
    <b>Protocolo:</b> <span class="font-mono font-bold">${ficha.protocolo}</span><br>
    <b>Data:</b> ${ficha.dataHora}
  `;
  // SEMPRE mostra o termo - link travado que nunca dá 404
  const urlFinal = "https://manch-tech.github.io/app-ficha/ficha/termo.html?proto=" + encodeURIComponent(ficha.protocolo);
  document.getElementById("lista-docs-real").innerHTML = `
    <div class="flex justify-between items-center border rounded-xl p-4 bg-white">
      <div><b>Termo de Declaração de Conflito - GPS</b><div class="text-xs text-zinc-500">Baixe, preencha, assine e envie de volta via WhatsApp</div><div class="text-[11px] font-mono text-zinc-400 mt-1">${urlFinal}</div></div>
      <a href="${urlFinal}" target="_blank" class="bg-zinc-900 text-white px-5 h-10 rounded-xl flex items-center text-sm font-bold">Baixar / Imprimir</a>
    </div>
  `;
  document.getElementById("tela-comp").classList.remove("hidden");
  window.scrollTo(0,0);
}
function enviarZap(){
  if(!fichaAtual) return;
  const txt=`FICHA QUALIFICAÇÃO - ${fichaAtual.razao} - CNPJ ${fichaAtual.cnpj} - Protocolo ${fichaAtual.protocolo} - Resp ${fichaAtual.responsavel} - End ${fichaAtual.endereco}`;
  window.open(`https://wa.me/${Store.getWhats()}?text=${encodeURIComponent(txt)}`,"_blank");
}
setTimeout(()=>{ try{ Store.syncFromSupabase(); }catch(e){} },500);
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
