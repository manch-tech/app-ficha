name: Manter Supabase Vivo

on:
  schedule:
    - cron: '0 12 * * *'  # todo dia 09h Brasil
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar Supabase Manoel Pedra
        run: |
          curl -s "https://pirpitolwdgzildiawdr.supabase.co/rest/v1/codigos?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -o /dev/null
          echo "Ping ok - Supabase nao vai pausar"